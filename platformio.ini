[platformio]
default_envs = t8s2

[env:t8s2]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags = -DBOARD_HAS_PSRAM -DTLS_EXTMEM  ; TLS_EXTMEM : mémoire interne trop juste (S2)
lib_deps =
  xreef/SimpleFTPServer@3.0.1
  bblanchon/ArduinoJson@7.4.2

[env:ota]
extends = env:t8s2
upload_protocol = espota
upload_port = cloud2usb.local
upload_flags = --host_port=54010

[env:xiaos3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_unflags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1  ; USB pour la clé (TinyUSB), pas le port série
build_flags =
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DSD_NATIVE
  -DDEFAULT_FTP_SERVER_NETWORK_TYPE_ESP32=NETWORK_ESP32
  -DDEFAULT_STORAGE_TYPE_ESP32=STORAGE_SD_MMC
lib_deps = ${env:t8s2.lib_deps}

[env:xiaos3_ota]
extends = env:xiaos3
upload_protocol = espota
upload_port = cloud2usb.local
upload_flags = --host_port=54010

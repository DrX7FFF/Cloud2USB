; Test SD isolé. STEP = éléments de Cloud2USB ajoutés (cumulatifs) :
; 0 SD seule, 1 Wi-Fi, 2 extmem 256, 3 SD.end/begin, 4 web+mDNS+OTA+FTP, 5 écritures dans une tâche
[env]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_port = /dev/ttyUSB0
build_unflags = -DCORE_DEBUG_LEVEL=0
lib_deps = xreef/SimpleFTPServer@3.0.1

[env:step0]
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=2 -DSTEP=0
[env:step1]
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=2 -DSTEP=1
[env:step2]
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=2 -DSTEP=2
[env:step3]
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=2 -DSTEP=3
[env:step4]
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=2 -DSTEP=4
[env:step5]
build_flags = -DBOARD_HAS_PSRAM -DCORE_DEBUG_LEVEL=2 -DSTEP=5
